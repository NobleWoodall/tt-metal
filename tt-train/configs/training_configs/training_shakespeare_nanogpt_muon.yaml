training_config:
  project_name: "tt_train_nano_gpt"
  seed: 5489
  model_save_interval: 100
  batch_size: 64
  num_epochs: 1
  max_steps: 1000
  learning_rate: 0.001
  weight_decay: 0.0
  momentum: 0.95
  use_moreh_adamw: false
  use_sgd: false
  use_sgd_fused: false
  use_clip_grad_norm: false
  clip_grad_norm_max_norm: 1.0
  warmup_steps: 10
  tokenizer_type: "char"
  data_path: "data/shakespeare.txt"
  model_config: "configs/model_configs/nanogpt.yaml"
  optimizer:
    type: MuonComposite
    lr: 0.01
    momentum: 0.95
    ns_steps: 5

device_config:
  enable_ddp: false
  mesh_shape: [1,1]

eval_config:
  repetition_penalty: 1.0
  temperature: 0.7
  top_k: 50
  top_p: 1.0
