training_config:
  project_name: "tt_train_nano_gpt"
  seed: 5489
  model_save_interval: 500
  batch_size: 8
  num_epochs: 1
  max_steps: 3000
  use_clip_grad_norm: false
  clip_grad_norm_max_norm: 1.0
  warmup_steps: 50
  model_config: "${TT_METAL_RUNTIME_ROOT}/tt-train/configs/model_configs/tinyllama.yaml"
  tokenizer_type: "bpe"
  data_path: "data/tinyllama_wikitext103.yaml"
  optimizer:
    type: SGD
    lr: 0.05
    momentum: 0.9
    weight_decay: 0.0001

device_config:
  enable_ddp: false
  mesh_shape: [1,1]

eval_config:
  repetition_penalty: 1.0
  temperature: 0.7
  top_k: 50
  top_p: 1.0
